# Unity License Activation Request
# Run this workflow manually to generate activation file
# https://game.ci/docs/github/activation

name: Unity Activation

on:
  workflow_dispatch:
    inputs:
      unityVersion:
        description: 'Unity Version'
        required: true
        default: '6000.3.4f1'
        type: choice
        options:
          - '2021.3.45f2'
          - '2022.3.62f3'
          - '6000.3.4f1'

jobs:
  request-activation:
    name: Request Activation File (${{ inputs.unityVersion }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getALF
        with:
          unityVersion: ${{ inputs.unityVersion }}

      - name: Upload activation file
        uses: actions/upload-artifact@v7
        with:
          name: Unity-Activation-${{ inputs.unityVersion }}
          path: ${{ steps.getALF.outputs.filePath }}
          retention-days: 1
