# Publishes a GitHub Release with the UPM tarball when a version tag (for example v1.2.0) is pushed.
# The tag must match Assets/NanoraUnityMCP/package.json; the notes are that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the tag matches package.json
        run: |
          version=$(python3 -c "import json;print(json.load(open('Assets/NanoraUnityMCP/package.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the tarball
        run: python3 scripts/release/build_tarball.py dist
      - name: Release notes from the CHANGELOG
        run: python3 scripts/release/changelog_section.py "$VERSION" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "nanora-unity-mcp $VERSION" --notes-file notes.md --verify-tag
